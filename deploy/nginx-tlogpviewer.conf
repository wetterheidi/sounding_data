# nginx-Vhost für tlogpviewer.wetterheidi.de -- Stand Etappe 5
#
# Zugriffs-Schichten:
#   /om/, /data/   oeffentlich (unveraendert)
#   /              Viewer: Pfoertner-Login (Tool-Haekchen "tlogpviewer")
#   /admin.html    NUR Tool-Admins (Haekchen "Tool-Admin" im Panel)
#   /api/          Pfoertner-Login; Nutzername + Admin-Flag gehen als
#                  X-Remote-User / X-Tool-Admin an die Python-API (:8765)
#
# htpasswd wird hier NICHT mehr verwendet.

server {
    server_name tlogpviewer.wetterheidi.de;

    root /apps/TLogPViewer/sounding_data;
    index sounding_viewer.html;

    # --- Pfoertner: gilt fuer den gesamten Vhost -----------------------------
    set $pfoertner_tool tlogpviewer;
    auth_request /_pfoertner;
    error_page 401 = @zum_login;
    error_page 403 /gesperrt.html;
    include snippets/pfoertner.conf;

    # Antwort-Header des Pfoertners abgreifen, um sie an Backends
    # weiterreichen zu koennen:
    auth_request_set $auth_user       $upstream_http_x_auth_user;
    auth_request_set $auth_tool_admin $upstream_http_x_auth_tool_admin;
    # --------------------------------------------------------------------------

    # ---------------------------------------------------------------------------
    # Sounding-Daten (öffentlich – werden vom Viewer per JS geladen)
    # ---------------------------------------------------------------------------
    location /data/ {
        auth_request off;
        alias /apps/TLogPViewer/data/;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------------
    # OM Viewer – öffentliche Variante OHNE Login (unveraendert)
    # ---------------------------------------------------------------------------
    location /om/ {
        auth_request off;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ---------------------------------------------------------------------------
    # Admin-Oberfläche – nur fuer Nutzer mit Tool-Admin-Haekchen.
    # Andere angemeldete Nutzer sehen die Sperrseite (403).
    # ---------------------------------------------------------------------------
    location = /admin.html {
        auth_request /_pfoertner_admin;
    }

    # ---------------------------------------------------------------------------
    # Admin-API – Proxy zur lokalen Python-API. Zugang: jeder angemeldete
    # tlogpviewer-Nutzer; WER Admin-Aktionen darf, entscheidet die API
    # anhand der durchgereichten Header (statt frueher $remote_user):
    #   X-Remote-User  Nutzername aus dem Pfoertner
    #   X-Tool-Admin   "1" = Tool-Admin-Haekchen gesetzt, sonst "0"
    # ---------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header   X-Remote-User $auth_user;
        proxy_set_header   X-Tool-Admin  $auth_tool_admin;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------------------
    # Viewer und alle statischen Dateien
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tlogpviewer.wetterheidi.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tlogpviewer.wetterheidi.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = tlogpviewer.wetterheidi.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name tlogpviewer.wetterheidi.de;
    return 404; # managed by Certbot


}
