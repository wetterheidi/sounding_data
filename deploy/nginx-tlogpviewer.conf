# nginx-Vhost für tlogpviewer.wetterheidi.de
# Einzuspielen nach: /etc/nginx/sites-available/tlogpviewer.wetterheidi.de
# Aktivieren mit: ln -s /etc/nginx/sites-available/tlogpviewer.wetterheidi.de /etc/nginx/sites-enabled/
# SSL erzeugen mit: certbot --nginx -d tlogpviewer.wetterheidi.de

server {
    listen 80;
    listen [::]:80;
    server_name tlogpviewer.wetterheidi.de;

    root /apps/TLogPViewer/sounding_data;
    index sounding_viewer.html;

    # ---------------------------------------------------------------------------
    # Sounding-Daten (öffentlich – werden vom Viewer per JS geladen)
    # ---------------------------------------------------------------------------
    location /data/ {
        alias /apps/TLogPViewer/data/;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------------
    # OM Viewer – öffentliche Variante OHNE Passwortschutz. Lädt alle Daten
    # clientseitig live von Open-Meteo (api.open-meteo.com bzw. OM-Server),
    # greift also weder auf /data/ noch auf die Admin-API zu.
    # ---------------------------------------------------------------------------
    location /om/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ---------------------------------------------------------------------------
    # Admin-Oberfläche – Login über die zentrale htpasswd-Datei; wer Admin ist,
    # entscheidet die API anhand von /etc/wetterheidi/roles.json
    # ---------------------------------------------------------------------------
    location = /admin.html {
        auth_basic           "wetterheidi";
        auth_basic_user_file /etc/nginx/.htpasswd-wetterheidi;
    }

    # ---------------------------------------------------------------------------
    # Admin-API – Proxy zur lokalen Python-API; nginx reicht den Login-Namen als
    # X-Remote-User durch, die API prüft ihn gegen die zentrale Rollen-Datei
    # ---------------------------------------------------------------------------
    location /api/ {
        auth_basic           "wetterheidi";
        auth_basic_user_file /etc/nginx/.htpasswd-wetterheidi;

        proxy_pass         http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header   X-Remote-User $remote_user;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------------------
    # Viewer und alle statischen Dateien – geschützt per HTTP Basic Auth
    # (Benutzer: wetterheidi und weitere normale Nutzer)
    # ---------------------------------------------------------------------------
    location / {
        auth_basic           "wetterheidi";
        auth_basic_user_file /etc/nginx/.htpasswd-wetterheidi;
        try_files $uri $uri/ =404;
    }
}
